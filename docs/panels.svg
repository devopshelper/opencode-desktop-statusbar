<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="232" viewBox="0 0 1016 232" role="img" aria-label="Hover card panels: cache, context and throughput">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1016" height="232" fill="#000000"/>

  <!-- ============ CACHE ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="16" y="16" width="320" height="200" rx="12" fill="#000000" stroke="#00e5ff" stroke-opacity="0.30"/>
    <text x="34" y="40" fill="#7f8ea3" font-size="10" letter-spacing="1.4">CACHE</text>
    <text x="320" y="40" fill="#7f8ea3" font-size="10" letter-spacing="1.4" text-anchor="end">⚡ SEGMENT</text>

    <text x="34" y="64" fill="#96aabe" font-size="11.5">hit rate</text>
    <text x="320" y="64" fill="#00e676" font-size="11.5" text-anchor="end" font-weight="600">86.0%</text>

    <text x="34" y="81" fill="#96aabe" font-size="11.5">cache read</text>
    <text x="320" y="81" fill="#ffffff" font-size="11.5" text-anchor="end">346.1k tok</text>

    <text x="34" y="98" fill="#96aabe" font-size="11.5">cache write</text>
    <text x="320" y="98" fill="#ffffff" font-size="11.5" text-anchor="end">12.4k tok</text>

    <text x="34" y="115" fill="#96aabe" font-size="11.5">full price</text>
    <text x="320" y="115" fill="#ffffff" font-size="11.5" text-anchor="end">$0.19</text>

    <text x="34" y="132" fill="#96aabe" font-size="11.5">saved</text>
    <text x="320" y="132" fill="#00e676" font-size="11.5" text-anchor="end">−$0.31</text>

    <text x="34" y="149" fill="#96aabe" font-size="11.5">meter</text>
    <text x="320" y="149" fill="#00e5ff" font-size="11.5" text-anchor="end">▰▰▰▰▱</text>

    <line x1="34" y1="164" x2="320" y2="164" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="34" y="182" fill="#7f8ea3" font-size="10.5">⚡ 86% of prompt from cache</text>
  </g>

  <!-- ============ CONTEXT ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="348" y="16" width="320" height="200" rx="12" fill="#000000" stroke="#00e5ff" stroke-opacity="0.30"/>
    <text x="366" y="40" fill="#7f8ea3" font-size="10" letter-spacing="1.4">CONTEXT</text>
    <text x="652" y="40" fill="#7f8ea3" font-size="10" letter-spacing="1.4" text-anchor="end">🪟 SEGMENT</text>

    <text x="366" y="64" fill="#96aabe" font-size="11.5">used</text>
    <text x="652" y="64" fill="#ffffff" font-size="11.5" text-anchor="end">84.1k tok</text>

    <text x="366" y="81" fill="#96aabe" font-size="11.5">window</text>
    <text x="652" y="81" fill="#ffffff" font-size="11.5" text-anchor="end">200.0k tok</text>

    <text x="366" y="98" fill="#96aabe" font-size="11.5">fill</text>
    <text x="652" y="98" fill="#ffffff" font-size="11.5" text-anchor="end">42.0%</text>

    <text x="366" y="115" fill="#96aabe" font-size="11.5">free</text>
    <text x="652" y="115" fill="#ffffff" font-size="11.5" text-anchor="end">115.9k tok</text>

    <text x="366" y="132" fill="#96aabe" font-size="11.5">compact at</text>
    <text x="652" y="132" fill="#ffc400" font-size="11.5" text-anchor="end">90%</text>

    <text x="366" y="149" fill="#96aabe" font-size="11.5">session</text>
    <text x="652" y="149" fill="#ffffff" font-size="11.5" text-anchor="end">402.3k tok</text>

    <line x1="366" y1="164" x2="652" y2="164" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="366" y="182" fill="#7f8ea3" font-size="10.5">🪟 84.1k / 200k   42%</text>
    <rect x="366" y="192" width="286" height="4" rx="2" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="366" y="192" width="120" height="4" rx="2" fill="#00e5ff"/>
  </g>

  <!-- ============ THROUGHPUT ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="680" y="16" width="320" height="200" rx="12" fill="#000000" stroke="#00e5ff" stroke-opacity="0.30"/>
    <text x="698" y="40" fill="#7f8ea3" font-size="10" letter-spacing="1.4">THROUGHPUT</text>
    <text x="984" y="40" fill="#7f8ea3" font-size="10" letter-spacing="1.4" text-anchor="end">🌊 SEGMENT</text>

    <text x="698" y="64" fill="#96aabe" font-size="11.5">now</text>
    <text x="984" y="64" fill="#00e5ff" font-size="11.5" text-anchor="end" font-weight="600">47 tok/s</text>

    <text x="698" y="81" fill="#96aabe" font-size="11.5">peak 60s</text>
    <text x="984" y="81" fill="#ffffff" font-size="11.5" text-anchor="end">128 tok/s</text>

    <text x="698" y="98" fill="#96aabe" font-size="11.5">queued</text>
    <text x="984" y="98" fill="#ffc400" font-size="11.5" text-anchor="end">1</text>

    <text x="698" y="115" fill="#96aabe" font-size="11.5">flow</text>
    <text x="984" y="115" fill="#ffffff" font-size="11.5" text-anchor="end">1.76s per traverse</text>

    <text x="698" y="132" fill="#96aabe" font-size="11.5">tool</text>
    <text x="984" y="132" fill="#ffc400" font-size="11.5" text-anchor="end">⚙ read</text>

    <text x="698" y="149" fill="#96aabe" font-size="11.5">state</text>
    <text x="984" y="149" fill="#00e676" font-size="11.5" text-anchor="end">busy</text>

    <polyline fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"
      points="698,196 708,190 718,193 728,184 738,181 748,188 758,185 768,191 778,183 788,180 798,187 808,184 818,190 828,185 838,181 848,177 858,183 868,179 878,185 888,181 898,187 908,183 918,189 928,185 938,192 948,188 958,193 968,189 978,184 984,187"/>
    <line x1="698" y1="199" x2="984" y2="199" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
</svg>
